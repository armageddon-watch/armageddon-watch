name: News pipeline

# Fills data/story.json for "Same story, every region". No secrets needed.
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, at 17 minutes past
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/news.yml"
      - "data/outlets.json"

permissions:
  contents: write

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch regional coverage
        run: python3 scripts/fetch_news.py
        env:
          # Optional. Without it the AI framing summary is skipped and everything else still runs.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Fetch news for the week's biggest earthquakes
        continue-on-error: true
        run: python3 scripts/fetch_quake_news.py
      - name: Commit data files if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/story.json data/quake_news.json 2>/dev/null || git add data/story.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Update news data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
