name: News pipeline

# Fills data/story.json for "Same story, every region". No secrets needed.
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, at 17 minutes past
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/news.yml"
      - "data/outlets.json"

permissions:
  contents: write

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch regional coverage
        run: python3 scripts/fetch_news.py
      - name: Commit story.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/story.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Update regional news comparison"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
