name: News pipeline

# Fills data/story.json, quake_news.json, conflict_news.json and unrest_news.json.
# Only the AI framing summary needs a secret; everything else runs without one.
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, at 17 minutes past
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/news.yml"
      - "data/outlets.json"

permissions:
  contents: write

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always the newest scripts and data, not the commit that triggered the run
      - name: Fetch regional coverage
        run: python3 scripts/fetch_news.py
        env:
          # Optional. Without it the AI framing summary is skipped and everything else still runs.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Fetch news for the week's biggest earthquakes
        continue-on-error: true
        run: python3 scripts/fetch_quake_news.py
      - name: Fetch conflict news for the map
        continue-on-error: true
        run: python3 scripts/fetch_conflict_news.py
      - name: Fetch protest and riot news for the map
        continue-on-error: true
        run: python3 scripts/fetch_unrest_news.py
      - name: Commit data files if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only the files this run actually wrote.
          changed=$(git status --porcelain -- data/story.json data/quake_news.json data/conflict_news.json data/unrest_news.json | awk '{print $2}')
          if [ -z "$changed" ]; then echo "No change."; exit 0; fi
          mkdir -p "$RUNNER_TEMP/out"
          for f in $changed; do cp "$f" "$RUNNER_TEMP/out/$(basename "$f")"; done
          # Lay the new files over the latest main and push. If main moved meanwhile, start again from the new main.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            for f in $changed; do cp "$RUNNER_TEMP/out/$(basename "$f")" "$f"; done
            git add $changed
            if git diff --cached --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update news data"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt $attempt); retrying."
            sleep 5
          done
          echo "Could not push after 3 attempts."
          exit 1
